# REVIEWABLE TEMPLATE: merge in a NEW supported host session, not this session.
# Requires a client supporting permission profiles (0.138.0+ baseline).
# Managed policy must permit this profile. Do not mix with legacy sandbox settings.
default_permissions = "trise-local-browser"
approval_policy = "on-request"

[features]
network_proxy = true

[permissions.trise-local-browser.workspace_roots]
"/Users/anjanreddy/wrk/trise" = true

[permissions.trise-local-browser.filesystem]
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
"/opt/homebrew" = "read"
"/Users/anjanreddy/.rbenv/versions/4.0.7" = "read"
"/Applications/Google Chrome.app" = "read"

[permissions.trise-local-browser.filesystem.":workspace_roots"]
"." = "write"
".git" = "read"
".codex" = "read"
".agents" = "read"
".aws" = "deny"
"trise-ui/.git" = "read"
"trise-api/.git" = "read"
"trise-architecture/.git" = "read"

[permissions.trise-local-browser.network]
enabled = true
allow_local_binding = false

[permissions.trise-local-browser.network.domains]
"127.0.0.1" = "allow"
"localhost" = "allow"
